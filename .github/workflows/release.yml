name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME}
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=coop_${VERSION#v}_${os}_${arch}
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "build/$name/coop" ./cmd/coop
            cp LICENSE README.md "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
